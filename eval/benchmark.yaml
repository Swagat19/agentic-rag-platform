# Eval benchmark — v1 (25 questions).
#
# Authoring rules (see eval/README.md for full rationale):
#   * Questions are written without reference to the SQL-as-tool feature
#     or to the kpi_facts table contents. They are framed as a generic
#     ESG / sustainability analyst would phrase them.
#   * Distribution across categories is fixed up front (10 factoid,
#     6 multi-hop, 6 table-lookup, 3 negative) so per-category metrics
#     stay stable across runs.
#   * `gold_chunk_keywords` is the loose ground-truth: a chunk that
#     contains ALL these keywords (case-insensitive substring) is
#     treated as gold by the keyword fallback metric.
#   * `gold_chunk_ids` is the strict ground-truth, bootstrapped by
#     running each question through /search/hybrid at k=8 and
#     inspecting the top chunks. The labelling rationale is captured
#     in YAML comments so the labels are auditable.
#   * `expected_numbers` is used for numeric_match scoring of /chat
#     answers. Leave empty for non-numeric or definitional questions.
#   * Negative questions intentionally have empty gold lists; the
#     LLM judge grades whether the agent refuses cleanly instead.

corpus:
  description: "NTT DATA Sustainability Report 2024 (sr2024.pdf) only"
  expected_documents:
    - sr2024

questions:

  # ---------------------------------------------------------------
  # Factoid (10) -- direct lookup of a single specific fact
  # ---------------------------------------------------------------

  - id: scope12-target-2030
    category: factoid
    question: "By what percentage does NTT DATA aim to reduce Scope 1 and 2 GHG emissions by fiscal 2030, compared with what baseline year?"
    gold_chunk_keywords: ["68", "Scope 1", "fiscal 2021"]
    gold_chunk_ids:
      - "ad263e0d-5eba-45c4-a5dc-f2b674517a75"
    expected_numbers: ["68", "2021", "2030"]

