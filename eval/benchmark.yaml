      - "900528e8-9aa2-414d-8bc2-63c3c6c3390a"
    expected_numbers: ["0"]

  - id: compliance-training-target
    category: table-lookup
    question: "What is NTT DATA's target participation rate for compliance internet-based training (IBT)?"
    gold_chunk_keywords: ["IBT", "100"]
    # 3acdee72 lists the "Compliance IBT participation rate -> 100%"
    # target row directly.
    gold_chunk_ids:
      - "3acdee72-676b-4359-9dbd-09350c61a625"
    expected_numbers: ["100"]

  - id: workshop-participation-target
    category: table-lookup
    question: "What employee participation rate target does NTT DATA set for sustainability workshops in fiscal 2024?"
    gold_chunk_keywords: ["workshop", "80"]
    # 3acdee72 lists the workshop / external-support participation
    # target of 80% under the FY2024 indicators column.
    gold_chunk_ids:
      - "3acdee72-676b-4359-9dbd-09350c61a625"
    expected_numbers: ["80"]

  - id: supplier-engagement-fy2023
    category: table-lookup
    question: "What ratio of direct communication with important suppliers did NTT DATA achieve in fiscal 2023?"
    gold_chunk_keywords: ["suppliers", "100"]
    # 3acdee72 (FY2024 table) and a0d07cd7 (supplier-engagement
    # narrative) both report the 100% direct-communication achievement.
    gold_chunk_ids:
      - "3acdee72-676b-4359-9dbd-09350c61a625"
      - "a0d07cd7-bd0b-4e00-9513-fc633ebd9057"
    expected_numbers: ["100"]

